<!DOCTYPE html>
<html lang="es" data-theme="auto">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Precios de la luz en España</title>
        <link rel="shortcut icon" href="favicon.ico">
        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
        <link rel="manifest" href="site.webmanifest">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Martian+Mono:wdth,wght@75..112.5,400..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="page.css">
        <!-- The theme is applied before painting so that the page never shows the light one and then turns dark. -->
        <script>
            try {
                document.documentElement.dataset.theme = localStorage.getItem('tema') ?? 'auto'
            } catch {
                // The browser refuses to remember it, so the system theme stays.
            }
        </script>
    </head>
    <body>
        <div class="page">
            <header class="header">
                <h1>Precio de la electricidad</h1>
                <p class="subtitle">España · €/kWh por hora</p>
            </header>

            <div class="controls">
                <div class="day-selector">
                    <button type="button" id="previousDay" class="control arrow" title="Día anterior" disabled>‹</button>
                    <input type="date" id="daySelector" class="control">
                    <button type="button" id="nextDay" class="control arrow" title="Día siguiente" disabled>›</button>
                </div>
                <select id="regionSelector" class="control" aria-label="Zona"></select>
            </div>

            <p id="dayError" class="error" hidden>No hay precios guardados para ese día.</p>

            <section id="nowPanel" class="card now-panel" hidden>
                <div>
                    <span class="now-label">Ahora · <span id="nowRange"></span></span>
                    <span class="now-price"><span id="nowPrice"></span> <span class="unit">€/kWh</span></span>
                </div>
                <span id="nowLevel" class="badge"></span>
            </section>

            <!-- The chart and the table show the same prices, so they share one card,
                 and the selector in its head chooses which of them is shown. -->
            <section class="card">
                <div class="card-head">
                    <h2>Precios · <span id="pricesRegion"></span></h2>
                    <div class="segmented view-selector" id="viewSelector" role="group" aria-label="Vista">
                        <button type="button" data-view="chart">Gráfica</button>
                        <button type="button" data-view="table">Tabla</button>
                    </div>
                </div>
                <div id="chartView">
                    <div class="chart">
                        <div class="chart-grid">
                            <div id="yMax"></div>
                            <div id="yMid"></div>
                            <div></div>
                        </div>
                        <div id="chartBars" class="chart-bars"></div>
                    </div>
                    <div class="hour-labels" id="hourLabels"></div>
                </div>
                <div id="tableView" hidden>
                    <div class="table" id="priceTable"></div>
                </div>
                <!-- The chart and the table mark the levels and the current hour in
                     the same way, so they share the legend. -->
                <div class="legend">
                    <span class="low">Barata</span>
                    <span class="medium">Media</span>
                    <span class="high">Cara</span>
                    <span class="now-legend" id="nowLegend" hidden></span>
                </div>
            </section>

            <p id="updateInfo" class="update-info" hidden></p>

            <!-- The theme goes after the prices, which are what the page is read
                 for. On a wide screen it is drawn next to the title. -->
            <div class="segmented theme-selector" id="themeSelector" role="group" aria-label="Tema">
                <button type="button" data-theme="auto">Auto</button>
                <button type="button" data-theme="light">Claro</button>
                <button type="button" data-theme="dark">Oscuro</button>
            </div>

            <p class="source">Fuente: <a href="https://www.ree.es/">Red Eléctrica</a>.</p>
        </div>
        <script type="module" src="page.js"></script>
    </body>
</html>
