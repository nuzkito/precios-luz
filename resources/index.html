<!DOCTYPE html>
<html lang="es" data-theme="auto">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Precios de la luz en España</title>
        <link rel="shortcut icon" href="favicon.ico">
        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
        <link rel="manifest" href="site.webmanifest">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="page.css">
        <!-- The theme is applied before painting so that the page never shows the light one and then turns dark. -->
        <script>
            try {
                document.documentElement.dataset.theme = localStorage.getItem('tema') ?? 'auto'
            } catch {
                // The browser refuses to remember it, so the system theme stays.
            }
        </script>
    </head>
    <body>
        <div class="page">
            <header class="header">
                <div>
                    <h1>Precio de la electricidad</h1>
                    <p class="subtitle">España · €/kWh por hora</p>
                </div>
                <button type="button" id="themeButton" class="control">Tema: <span id="themeLabel">Auto</span></button>
            </header>

            <div class="controls">
                <div class="day-selector">
                    <button type="button" id="previousDay" class="control arrow" title="Día anterior" disabled>‹</button>
                    <input type="date" id="daySelector" class="control">
                    <button type="button" id="nextDay" class="control arrow" title="Día siguiente" disabled>›</button>
                </div>
                <select id="regionSelector" class="control" aria-label="Zona"></select>
                <div class="view-selector" id="viewSelector" role="group" aria-label="Vista">
                    <button type="button" data-view="both">Gráfica y tabla</button>
                    <button type="button" data-view="chart">Gráfica</button>
                    <button type="button" data-view="table">Tabla</button>
                </div>
            </div>

            <p id="dayInfo" class="day-info">Cargando los precios…</p>
            <p id="dayError" class="error" hidden>No hay precios guardados para ese día.</p>

            <section id="nowPanel" class="card now-panel" hidden>
                <div>
                    <span class="now-label">Ahora · <span id="nowRange"></span></span>
                    <span class="now-price"><span id="nowPrice"></span> <span class="unit">€/kWh</span></span>
                </div>
                <span id="nowLevel" class="badge"></span>
            </section>

            <section id="chartSection" class="card">
                <h2>Gráfica · <span id="chartRegion"></span></h2>
                <div class="chart">
                    <div class="chart-grid">
                        <div id="yMax"></div>
                        <div id="yMid"></div>
                        <div></div>
                    </div>
                    <div class="chart-plot">
                        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                            <path id="chartArea" class="chart-area"></path>
                            <path id="chartLine" class="chart-line"></path>
                        </svg>
                        <div id="nowLine" class="now-line" hidden></div>
                        <div id="chartDots"></div>
                    </div>
                </div>
                <div class="hour-labels" id="hourLabels"></div>
                <div class="legend">
                    <span class="low">Barata</span>
                    <span class="medium">Media</span>
                    <span class="high">Cara</span>
                    <span class="now-legend" id="nowLegend"></span>
                </div>
            </section>

            <section id="tableSection" class="card">
                <h2>Tabla · <span id="tableRegion"></span></h2>
                <div class="table" id="priceTable"></div>
            </section>

            <p class="source">Fuente: <a href="https://www.ree.es/">Red Eléctrica</a>.</p>
        </div>
        <script type="module" src="page.js"></script>
    </body>
</html>
