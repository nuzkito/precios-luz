name: Daily Price Update

on:
  schedule:
    # 21:00 Europe/Madrid (20:00 UTC in winter, 19:00 UTC in summer), which is
    # when the REE has already published the prices of the next day.
    - cron: '0 19,20 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    # The workflow itself commits the prices of the day: without this, that
    # commit would trigger another run.
    paths-ignore:
      - 'data/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check-time:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.madrid-time.outputs.should-run }}

    steps:
      - name: Check Europe/Madrid time
        id: madrid-time
        if: github.event_name != 'workflow_dispatch'
        run: |
          hour=$(TZ=Europe/Madrid date +%H)
          if [ "$hour" = "21" ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
          fi

  update-prices:
    needs: check-time
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || needs.check-time.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Update prices and build the site
        run: npm run update

      - name: Commit new data files
        run: |
          # Identity of the bot account behind GITHUB_TOKEN. The user id in the
          # noreply address is what makes GitHub attribute the commit to it.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          # The run saves the prices of tomorrow, and those of today too when an
          # earlier one was missed, so the message names the days that are new.
          days=$(git diff --staged --name-only -- data | sed -E 's|data/(....)/(..)/(..)\.json|\1-\2-\3|' | paste -sd , - | sed 's/,/, /g')
          git diff --staged --quiet || git commit -m "Add prices for $days"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
